name: Feature request
description: Propose a new capability or an improvement to CodeGraph VBA.
title: "feat: "
labels:
  - enhancement
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement. Provide enough evidence to make the request independently actionable.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the limitation, affected workflow, and observable impact.
      placeholder: What cannot be done safely or reliably today?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the desired behavior without prescribing unnecessary implementation details.
      placeholder: What should CodeGraph do instead?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List verifiable outcomes that prove the feature is complete.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Given ..., when ..., then ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds and why they are insufficient.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add relevant logs, links, platform details, or architectural constraints.
    validations:
      required: false
